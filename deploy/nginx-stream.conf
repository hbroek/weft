# /etc/nginx/stream-weft.conf, included from /etc/nginx/nginx.conf OUTSIDE the http { } block:
#     include /etc/nginx/stream-weft.conf;
# nginx keeps port 443 and looks only at the host name in the TLS hello (it does not decrypt anything):
# the names listed here go to linkagogo's http server, which moves to 127.0.0.1:8443,
# every other name (weftseed.com, *.weftseed.com, users' own domains) goes to Caddy on 127.0.0.1:8444.
# Both are told who really connected, with the PROXY protocol.
stream {
	map $ssl_preread_server_name $backend {
		hostnames;
		www.linkagogo.com   lgg;
		linkagogo.com       lgg;
		# CHANGE: add every other name this nginx serves over HTTPS
		""                  lgg;   # no name (a visit by IP address)
		default             weft;
	}
	upstream lgg  { server 127.0.0.1:8443; }
	upstream weft { server 127.0.0.1:8444; }

	server {
		listen 443;
		ssl_preread on;
		proxy_protocol on;
		proxy_pass $backend;
	}
}

